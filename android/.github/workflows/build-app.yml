name: Build Elder Launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Build APK - Debug Mode
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "---- Finding APKs ----"
          find . -name "*.apk" -type f

      - name: List outputs
        if: always()
        working-directory: ./android
        run: |
          ls -R app_pojavlauncher/build/outputs/ || true
          ls -R MainApp/build/outputs/ || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Elder-Launcher-APK
          path: android/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn