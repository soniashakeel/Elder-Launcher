workflows:
  android-release:
    name: Build Elder Launcher
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - google_play
    
    scripts:
      - name: Install Android SDK 34 and NDK 26.3
        script: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          yes | sdkmanager --licenses
      
      - name: Set execute permission
        script: chmod +x android/gradlew
      
      - name: Build APK
        script: |
          export ANDROID_NDK_HOME=/Users/builder/Library/Android/sdk/ndk/26.3.11579264
          cd android
          ./gradlew assembleRelease --stacktrace

    artifacts:
      - android/app_pojavlauncher/build/outputs/apk/**/*.apk
    
    publishing:
      email:
