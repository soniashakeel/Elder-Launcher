workflows:
  android-release:
    name: Build Elder Launcher
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - google_play
    
    scripts:
      - name: Install SDK and NDK
        script: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          yes | sdkmanager --licenses
          
      - name: Set NDK path for Gradle
        script: |
          echo "android.ndkVersion=26.3.11579264" >> android/local.properties
          echo "android.ndkPath=/Users/builder/Library/Android/sdk/ndk/26.3.11579264" >> android/local.properties
          
      - name: Set execute permission
        script: chmod +x android/gradlew
      
      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease --stacktrace

    artifacts:
      - android/app_pojavlauncher/build/outputs/apk/**/*.apk
    
    publishing:
      email:
        recipients:
          - soniashakeel1993@gmail.com