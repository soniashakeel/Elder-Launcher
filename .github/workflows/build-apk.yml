name: Build Elder Launcher APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK & SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Auto-Fix Vietnamese strings.xml
        run: |
          python3 -c "
          import re, glob
          files = glob.glob('android/app_pojavlauncher/src/main/res/values-*/strings.xml')
          for path in files:
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  c = f.read()
              # Fix any string with 2x %s without positional args
              def repl(m):
                  tag, name, body = m.group(0), m.group(1), m.group(2)
                  if 'formatted=' in tag: return tag
                  if '%1\$' in body: return tag
                  if body.count('%') >= 2:
                      return tag.replace(f'name=\"{name}\"', f'name=\"{name}\" formatted=\"false\"')
                  return tag
              new_c = re.sub(r'<string name=\"([^\"]+)\">([^<]*%[^<]*%[^<]*)</string>', repl, c)
              if new_c != c:
                  open(path, 'w', encoding='utf-8').write(new_c)
                  print(f'Fixed {path}')
          "

      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew :MainApp:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elder-Launcher-APK
          path: android/**/build/outputs/apk/**/*.apk